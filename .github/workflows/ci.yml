name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per branch/PR at a time; a new push cancels the stale in-progress run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trainer:
    name: trainer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trainer
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: trainer/uv.lock
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest

  app:
    name: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test -- --run
      - name: Build
        run: npm run build

  # Aggregate gate required by the branch ruleset. `if: always()` matters:
  # without it a failed dependency would leave this job *skipped*, and GitHub
  # treats a skipped required check as passing.
  verify:
    name: verify
    runs-on: ubuntu-latest
    needs: [trainer, app]
    if: always()
    steps:
      - name: All required jobs succeeded
        run: |
          echo "trainer: ${{ needs.trainer.result }}"
          echo "app:     ${{ needs.app.result }}"
          test "${{ needs.trainer.result }}" = "success" && test "${{ needs.app.result }}" = "success"
